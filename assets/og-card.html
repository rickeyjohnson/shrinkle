<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shrinkle preview card</title>
<!-- Source for og.jpg (render og.png at 1200x630, then: sips -s format jpeg -s formatOptions 82 og.png --out og.jpg) and, with ?icon, apple-touch-icon.png (180x180). Re-render with headless Chrome (see docs plan Task 5). -->
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#05060b}
  body{position:relative;font-family:'Space Mono',ui-monospace,monospace;color:#f3f5fa}
  #sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,#2e1656 0%,#0d0726 48%,#020107 100%)}
  canvas{position:absolute;inset:0}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
  .logo{display:flex;align-items:flex-end;gap:12px}
  .logo span{display:grid;place-items:center;border-radius:24%;color:#0b0c12;font-weight:700;line-height:1;box-shadow:0 10px 50px rgba(124,231,255,.28)}
  .tag{font-size:30px;letter-spacing:.32em;font-weight:700}
  .sub{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:21px;letter-spacing:.06em;color:rgba(243,245,250,.7)}
  body.icon,body.icon html{width:180px;height:180px}
  body.icon .wrap{gap:0}
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="c"></canvas>
<div class="wrap">
  <div class="logo" id="logo"></div>
  <div class="tag" id="tag">NAME IT TO SHRINK IT</div>
  <div class="sub" id="sub">A daily dive from the Cosmic Web to the atom</div>
</div>
<script>
  const icon=location.search.includes('icon');
  const W=icon?180:1200,H=icon?180:630;
  if(icon){document.documentElement.style.width=document.body.style.width=W+'px';document.documentElement.style.height=document.body.style.height=H+'px';document.body.classList.add('icon');}
  // stars + glow clusters
  const c=document.getElementById('c');c.width=W*2;c.height=H*2;c.style.width=W+'px';c.style.height=H+'px';
  const x=c.getContext('2d');x.scale(2,2);let s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  for(let i=0;i<(icon?40:420);i++){const r=rnd()*1.3+0.2;x.fillStyle=`rgba(${200+rnd()*55|0},${210+rnd()*45|0},255,${0.25+rnd()*0.6})`;x.beginPath();x.arc(rnd()*W,rnd()*H,r,0,7);x.fill();}
  if(!icon)for(let i=0;i<14;i++){const gx=rnd()*W,gy=rnd()*H,gr=30+rnd()*70,g=x.createRadialGradient(gx,gy,0,gx,gy,gr);g.addColorStop(0,rnd()<.5?'rgba(255,198,240,.35)':'rgba(170,200,255,.32)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(gx-gr,gy-gr,gr*2,gr*2);}
  // tile logo
  const logo=document.getElementById('logo');
  const letters=icon?['','','']:'SHRINKLE'.split('');
  const base=icon?62:118;
  letters.forEach((ch,i)=>{const k=icon?i*0.3:i*0.085,z=Math.round(base*(1-k)),sp=document.createElement('span');sp.textContent=ch;sp.style.width=sp.style.height=z+'px';sp.style.fontSize=Math.round(z*0.6)+'px';sp.style.background=`color-mix(in srgb,#7ce7ff ${Math.round((icon?i*45:i*13))}%,#f3f5fa)`;logo.appendChild(sp);});
  if(icon){document.getElementById('tag').remove();document.getElementById('sub').remove();logo.style.gap='8px';}
</script>
</body>
</html>
